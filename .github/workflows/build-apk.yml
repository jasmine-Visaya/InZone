
name: Build InZone Android APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # 3. Install frontend dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Build Vue/Ionic frontend
      - name: Build Ionic application
        run: npm run build

      # 5. Setup Java
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 6. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # 7. Check native Android project
      - name: Verify Android project
        run: |
          test -f android/gradlew
          test -f android/settings.gradle

      # 8. Synchronize Capacitor
      - name: Sync Capacitor Android
        run: npx cap sync android

      # 9. Allow Gradle execution
      - name: Make Gradle executable
        run: chmod +x android/gradlew

      # 10. Build debug APK
      - name: Build Android APK
        run: |
          cd android
          ./gradlew --no-daemon assembleDebug

      # 11. Rename APK
      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Inzone.apk

      # 12. Upload APK artifact
      - name: Upload InZone APK
        uses: actions/upload-artifact@v4
        with:
          name: InZone-Android-APK
          path: frontend/Inzone.apk
          if-no-files-found: error
          retention-days: 30
