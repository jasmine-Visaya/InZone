
name: Build InZone Android APK

on:
  push:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:

      # ==========================================
      # 1. CHECKOUT REPOSITORY
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. SETUP NODE.JS
      # ==========================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ==========================================
      # 3. INSTALL DEPENDENCIES
      # ==========================================

      - name: Install dependencies
        run: npm ci

      # ==========================================
      # 4. VERIFY INZONE ICON
      # ==========================================

      - name: Verify InZone App Icon
        run: |
          if [ ! -f assets/icon.png ]; then
            echo "::error::Missing frontend/assets/icon.png"
            exit 1
          fi

          npm ls @capacitor/assets --depth=0

          echo "InZone app icon found!"

      # ==========================================
      # 5. BUILD IONIC APPLICATION
      # ==========================================

      - name: Build Ionic application
        run: npm run build
        env:
          VITE_API_URL: https://inzone-backend.onrender.com

      # ==========================================
      # 6. SETUP JAVA
      # ==========================================

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ==========================================
      # 7. SETUP ANDROID SDK
      # ==========================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # ==========================================
      # 8. VERIFY ANDROID PROJECT
      # ==========================================

      - name: Verify Android project
        run: |
          test -f android/gradlew
          test -f android/settings.gradle

      # ==========================================
      # 9. SYNC CAPACITOR ANDROID
      # ==========================================

      - name: Sync Capacitor Android
        run: npx cap sync android

      # ==========================================
      # 10. GENERATE CUSTOM INZONE APP ICON
      # ==========================================

      - name: Generate InZone Android App Icon
        run: |
          npx --no-install @capacitor/assets generate --android \
            --iconBackgroundColor '#087957' \
            --iconBackgroundColorDark '#064b3c'

          echo "InZone Android launcher icons generated!"

      # ==========================================
      # 11. MAKE GRADLE EXECUTABLE
      # ==========================================

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      # ==========================================
      # 12. BUILD ANDROID APK
      # ==========================================

      - name: Build Android APK
        run: |
          cd android
          ./gradlew --no-daemon assembleDebug

      # ==========================================
      # 13. RENAME APK
      # ==========================================

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Inzone.apk

      # ==========================================
      # 14. UPLOAD APK
      # ==========================================

      - name: Upload InZone APK
        uses: actions/upload-artifact@v4
        with:
          name: InZone-Android-APK
          path: frontend/Inzone.apk
          if-no-files-found: error
          retention-days: 30
